[project]
name = "jobpilot"
version = "0.1.0"
description = "Telegram job channel -> reviewed application pipeline"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "python-telegram-bot>=21.0",
    "openai>=1.60",
    "groq>=0.30",
    "google-genai>=1.30",
    "anthropic>=0.40",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "playwright>=1.47",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
jobpilot = "jobpilot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jobpilot"]

[tool.setuptools.package-data]
jobpilot = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: test depends on an LLM; runs against recorded responses unless JOBPILOT_LIVE_LLM=1",
]
